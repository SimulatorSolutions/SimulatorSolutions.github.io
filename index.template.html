<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulator Solutions — Software Downloads</title>
<style>
  :root {
    --brand: #0067c0; --brand-2: #083f78; --ink: #17202c; --muted: #5b6472;
    --bg: #eef1f5; --card: #ffffff; --line: #e4e8ee; --ok: #1f9d55;
    --radius: 12px; --maxw: 760px;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.06);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
         background: var(--bg); color: var(--ink); line-height: 1.5; }

  /* ---- Branding (owned by this template) ---- */
  .hero { background: linear-gradient(120deg, var(--brand), var(--brand-2));
          color: #fff; padding: 30px 20px; }
  .hero-inner { max-width: var(--maxw); margin: 0 auto; display: flex;
                align-items: center; gap: 18px; }
  .hero .logo { width: 54px; height: 54px; border-radius: 10px; background: #fff;
                padding: 6px; box-shadow: var(--shadow); flex: 0 0 auto; }
  .hero .logo-text { width: 54px; height: 54px; border-radius: 10px; background: #fff;
                     color: var(--brand); font-weight: 800; font-size: 22px;
                     display: flex; align-items: center; justify-content: center; }
  .hero h1 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: .2px; }
  .hero .tag { margin: 2px 0 0; opacity: .9; font-size: 14px; }

  /* ---- Generated app cards ---- */
  main { max-width: var(--maxw); margin: 26px auto 8px; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: var(--radius); box-shadow: var(--shadow);
          padding: 18px 20px; margin-bottom: 16px; }
  .card-top { display: flex; align-items: baseline; justify-content: space-between;
              gap: 12px; flex-wrap: wrap; }
  .app-name { margin: 0; font-size: 18px; font-weight: 650; }
  .badge { white-space: nowrap; background: rgba(31,157,85,.12); color: var(--ok);
           font-weight: 650; font-size: 13px; padding: 3px 10px; border-radius: 999px; }
  .app-desc { margin: 10px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .card-actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { display: inline-block; background: var(--brand); color: #fff;
         text-decoration: none; font-weight: 600; font-size: 14px;
         padding: 9px 18px; border-radius: 8px; transition: background .15s; }
  .btn:hover { background: var(--brand-2); }
  .btn.ghost { background: transparent; color: var(--brand);
               border: 1px solid var(--brand); }
  .btn.ghost:hover { background: rgba(0,103,192,.08); }
  details.history { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  details.history summary { cursor: pointer; color: var(--muted); font-size: 13px;
                            list-style: none; user-select: none; }
  details.history summary::-webkit-details-marker { display: none; }
  details.history summary::before { content: "▸ "; color: var(--brand); }
  details.history[open] summary::before { content: "▾ "; }
  details.history ul { margin: 10px 0 2px; padding-left: 18px; font-size: 14px; }
  details.history li { margin: 3px 0; }
  details.history .hd { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .empty { text-align: center; color: var(--muted); background: var(--card);
           border: 1px dashed var(--line); border-radius: var(--radius); padding: 40px; }
  a { color: var(--brand); }

  /* ---- Footer (branding) ---- */
  footer { max-width: var(--maxw); margin: 16px auto 40px; padding: 0 16px;
           color: var(--muted); font-size: 12px; }
  .foot-inner { display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
                border-top: 1px solid var(--line); padding-top: 14px; }
  .foot-inner .gen { margin-left: auto; }
  @media (max-width: 520px) { .hero h1 { font-size: 20px; } }
</style>
</head>
